[project]
name = "ai-blog-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dev Goyal", email = "devgoyalg2346@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.159.1",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langgraph-cli[inmem]>=0.4.37",
    "uvicorn>=0.54.0",
    "watchdog>=6.0.0",
]

[project.scripts]
ai-blog-generator = "ai_blog_generator:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
